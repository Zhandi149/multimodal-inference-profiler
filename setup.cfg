[metadata]
name = multimodal-inference-profiler
version = 0.1.0
description = Single-request CUDA inference instrumentation with offline report examples
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.extras_require]
gpu =
    torch>=2.5,<3
    transformers>=4.57,<5
    Pillow>=10,<13
    accelerate>=1,<2

[options.entry_points]
console_scripts =
    mmprof = mmprof.cli:main
